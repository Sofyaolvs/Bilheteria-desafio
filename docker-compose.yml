services:
  db:
    image: postgres:16-alpine
    container_name: elite-eventos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
      POSTGRES_DB: eventos
    ports:
      - "5432:5432"
    volumes:
      - eventos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eventos_pgdata:
